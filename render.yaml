  # ---------------------------------------------------------------- SSR ----
  - name: voteapp-ssr
    type: web
    runtime: node
    region: ohio
    # Starter since 2026-08-21 (see the PLANS note at the top).
    plan: starter
    # No rootDir: Render makes files outside the root directory unavailable
    # at build and runtime, and this service needs the repo-root npm
    # workspace (lockfile + packages/api-client). Commands run from the repo
    # root and scope to the frontend workspace instead; buildFilter keeps
    # deploys triggered only by frontend-relevant changes.
    buildCommand: npm ci && npm run build --workspace frontend
    startCommand: npm run start --workspace frontend
    buildFilter:
      paths:
        - frontend/**
        - packages/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      # Loaders use the API's PUBLIC hostname — still, deliberately, even
      # though both services are paid now. The obvious upgrade (declare
      # API_INTERNAL_HOSTPORT, which resolveApiBase() in
      # frontend/src/lib/loadFromApi.ts ranks above API_PUBLIC_HOST) is a
      # TRAP: voteapp-api listens on port 10000 (ADDRESS_API_PORT above),
      # and Render prohibits private-network traffic on ports 10000, 18012,
      # 18013, and 19099 — docs "Private Network", same restriction this
      # file already records for voteapp-embeddings. The loader has no
      # fallback tier once the internal var is set, so declaring it would
      # 504 every SSR loader. Moving to the private network needs the API
      # off port 10000 first (PORT + ADDRESS_API_PORT, embeddings-style) —
      # and note `property: hostport` was observed 2026-08-12 resolving a
      # STALE port after such a change; prefer `property: host` plus an
      # explicitly pinned port. Separate PR if the extra hop ever matters.
      # RENDER_EXTERNAL_HOSTNAME via fromService/envVarKey keeps the
      # generated hostname out of the repo, so it survives service
      # recreation; the loader prepends https:// to this bare hostname.
      - key: API_PUBLIC_HOST
        fromService:
          name: voteapp-api
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      # NOTE: API_LOADER_TIMEOUT_MS and VITE_API_TIMEOUT_MS ("75000") were
      # removed 2026-08-21. They existed only to survive the free tier's
      # ~1-minute cold start; voteapp-api is starter now and always on, so
      # the code defaults apply again — 10s for the SSR loader
      # (DEFAULT_LOADER_TIMEOUT_MS, loadFromApi.ts) and 15s in the browser
      # (REQUEST_TIMEOUT_MS, packages/api-client/src/client.ts). Removing
      # them HERE is not enough: "Render preserves existing environment
      # variables, even if you omit them from the Blueprint file", so the
      # live values must ALSO be deleted on the voteapp-ssr service
      # (dashboard Environment tab, or DELETE
      # /v1/services/{id}/env-vars/{key}). If a genuinely slow endpoint
      # starts throwing "Upstream API timeout" 504s, raise the loader value
      # here rather than restoring the 75s cold-start headroom.
      - key: ADDRESS_API_TRUSTED_CLIENT_IP_HEADER
        value: X-Voteapp-Client-IP
      # Same value as the API's secret (referenced, not duplicated): loaders
      # hit the API's public host, so their relayed client-IP header needs
      # the same proof-of-edge the Worker attaches.
      - key: EDGE_SHARED_SECRET
        fromService:
          name: voteapp-api
          type: web
          envVarKey: EDGE_SHARED_SECRET
      # Chatbot widget flag, baked into the bundle at build time. References
      # the API's flag so the two services cannot drift; a mismatch degrades
      # gracefully (widget hidden, or open shows "not available").
      - key: VITE_CHATBOT_ENABLED
        fromService:
          name: voteapp-api
          type: web
          envVarKey: CHATBOT_ENABLED
      # Usage-analytics client flag, baked in at build time and mirrored
      # from the API's intake flag so the two cannot drift (a mismatch is
      # harmless: the client stops on the first 404).
      - key: VITE_USAGE_ANALYTICS_ENABLED
        fromService:
          name: voteapp-api
          type: web
          envVarKey: USAGE_ANALYTICS_ENABLED

  # ------------------------------------------------------------- workers ----
  # One process runs all three notification scheduler workers and re-asserts
  # their recurring BullMQ jobs on every boot (idempotent upserts).
  # Enabled 2026-09-06 (docs/plans/review-gaps-2026-09-06.md item 1): billing
  # has existed since 2026-08-08 and SES is in production mode. Election
  # result emails are NOT here — they stay manual
  # (`notifications:election-results -- --live` after each results sweep).
  # SENTRY_DSN is dashboard-managed (docs/deploy-checklist.md); set it on this
  # service and the prune cron when enabling monitoring.
  - name: voteapp-notification-workers
    type: worker
    runtime: node
    region: ohio
    plan: starter
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run notifications:workers
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voteapp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: voteapp-redis
          type: keyvalue
          property: connectionString
      - key: AUTH_FROM_EMAIL
        value: noreply@electionssimplified.com
      - key: AUTH_REPLY_TO_EMAIL
        value: contact@electionssimplified.com
      - key: AUTH_SES_REGION
        value: us-east-2
      - key: AUTH_PUBLIC_BASE_URL
        value: https://electionssimplified.com
      - key: NOTIFICATIONS_UNSUBSCRIBE_URL
        value: https://electionssimplified.com/api/email/unsubscribe
      # Physical postal address printed in the footer of issue broadcasts and
      # member newsletters (CAN-SPAM 16 CFR 316.5). Public, not a secret.
      - key: EMAIL_POSTAL_ADDRESS
        value: "Elections Simplified Inc., 1401 21st St #12323, Sacramento, CA 95811, US"
      - key: DEPLOY_ENV
        value: production
      # Candidate-follow digest goes out monthly: 10:00 ET on the 1st, after
      # the manual monthly records refresh (voteapp-followed-records-refresh
      # skill) has landed. The scheduler default is daily 14:00 UTC.
      - key: CANDIDATE_FOLLOW_DIGEST_DAILY_CRON
        value: "0 10 1 * *"
      - key: CANDIDATE_FOLLOW_DIGEST_DAILY_TZ
        value: America/New_York
      - fromGroup: voteapp-shared

  # ------------------------------------------------------------------ cron ----
  # The San Francisco finance cron below stays COMMENTED OUT (separate
  # decision); the notification prune cron is live.
  #
  # San Francisco finance v1 scheduling choice (docs/plans/plan-san-francisco-finance.md
  # Phase 7): a one-shot daily cron at 16:30 UTC (09:30 PDT / 08:30 PST —
  # after DataSF's nightly refresh year-round), NOT the resident BullMQ
  # worker. The *_SYNC_ENABLED flag lives on this cron service ONLY, so no
  # other service can write finance data.
  # - name: voteapp-san-francisco-finance-sync
  #   type: cron
  #   runtime: node
  #   region: ohio
  #   schedule: "30 16 * * *"
  #   rootDir: backend
  #   buildCommand: npm ci
  #   startCommand: npm run san-francisco-candidates:finance:sync-due
  #   envVars:
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: voteapp-db
  #         property: connectionString
  #     - key: SAN_FRANCISCO_CAMPAIGN_FINANCE_ENABLED
  #       value: "true"
  #     - key: SAN_FRANCISCO_CAMPAIGN_FINANCE_SYNC_ENABLED
  #       value: "true"
  - name: voteapp-notifications-prune
    type: cron
    runtime: node
    region: ohio
    schedule: "0 6 * * *"
    rootDir: backend
    buildCommand: npm ci
    # --live: the script is a dry run by default (it only counts), so without
    # the flag this cron would delete nothing every night.
    startCommand: npm run notifications:prune -- --live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voteapp-db
          property: connectionString
      - key: DEPLOY_ENV
        value: production

  # ------------------------------------------------------- chatbot (Ask) ----
  # ENABLED 2026-08-12 (docs/plans/chatbot-rag.md; spot-check passed): the TEI
  # embeddings service is a PAID private service (~$7/mo starter). The
  # blueprint carries only the FREE read side (CHATBOT_ENABLED + the
  # embeddings URL on voteapp-api, VITE_CHATBOT_ENABLED on voteapp-ssr).
  # The MONEY side stays dashboard-only on voteapp-api, off by default —
  # ALL THREE required to turn AI answers on:
  #   CHATBOT_LLM_ENABLED=true, CHATBOT_LLM_API_KEY=<spend-limited key>,
  #   CHATBOT_MODEL_TIER_FREE=<model id — deployment config only, never in
  #                            the repo; every account uses it today, a paid
  #                            tier would add its own variable>
  #   (optional overrides: CHATBOT_REASONING_EFFORT,
  #   CHATBOT_USER_DAILY_LIMIT, CHATBOT_DAILY_TOKEN_BUDGET,
  #   CHATBOT_LLM_BASE_URL, CHATBOT_LLM_TIMEOUT_MS). LLM off or
  #   misconfigured → retrieval-only answers, unchanged.
  # After first deploy: run `npm run chatbot:reindex` against the prod DB to
  # build the first index generation (until then the widget refuses cleanly).
  # dockerCommand is the FULL command including the binary — verified live
  # 2026-08-12: Render executes it through a shell, REPLACING the image's
  # ENTRYPOINT (args-only died instantly with zero output because the shell
  # tried to run "--model-id" itself; the full command deploys live). Do not
  # "fix" this back to arguments-only on classic Docker CMD reasoning.
  # --port 8080 because the TEI image defaults to 80 and Render RESERVES
  # port 10000 (it cannot carry private-network traffic). PORT matches so
  # Render's port detection agrees with where the app listens.
  - name: voteapp-embeddings
    type: pserv
    runtime: image
    region: ohio
    plan: starter
    image:
      url: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    dockerCommand: text-embeddings-router --model-id BAAI/bge-small-en-v1.5 --port 8080
    autoDeploy: false
    envVars:
      - key: PORT
        value: "8080"

  # ------------------------------------------------------------- key value ----
  - name: voteapp-redis
    type: keyvalue
    region: ohio
    plan: free
    maxmemoryPolicy: noeviction
    # Private-network access only; nothing outside Render needs Redis.
    ipAllowList: []

databases:
  - name: voteapp-db
    region: ohio
    # Upgraded off the free plan 2026-08-08, one day before the free
    # instance's 30-day expiry. Expiry does not delete on the spot: it makes
    # the database INACCESSIBLE (production down), and Render deletes it with
    # all its data only after a further 14-day grace period.
    # Sized by working set, not storage: the database holds ~290 MB, so
    # basic-256mb would have had less RAM than the data it serves and would
    # have gone to disk for the batch pipelines (backfills, record sweeps,
    # per-state finance syncs). basic-1gb keeps the hot set cached and gives
    # 0.5 CPU instead of 0.1. Storage is not part of the tier on paid plans —
    # it expands at $0.30/GB.
    plan: basic-1gb
    # Matches the live instance (autoscaling enabled 2026-08-08). Omitting
    # this would not drift THIS database — the blueprint spec retains the
    # current value for an existing database — but one created fresh from
    # this file defaults to false, so say it out loud.
    #
    # diskSizeGB is deliberately NOT pinned here. Autoscaling permanently
    # raises storage (1 GB -> 5 GB on the first trigger) and Render never
    # shrinks a volume, so a pinned size would sooner or later be asking for
    # a decrease. The trade-off is that a from-scratch create takes the Basic
    # default of 15 GB rather than 1 GB — set it deliberately at that point.
    storageAutoscalingEnabled: true

envVarGroups:
  - name: voteapp-shared
    envVars:
      # Send-only SES IAM key (ses:SendEmail only).
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Shared by the API server (verify) and every mailer (sign).
      - key: NOTIFICATIONS_UNSUBSCRIBE_SECRET
        generateValue: true
