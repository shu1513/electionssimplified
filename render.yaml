# Render Blueprint for the first public deploy (docs/deploy-render.md is the
# runbook; docs/deploy-checklist.md stays the platform-agnostic reference).
#
# Topology: Cloudflare (electionssimplified.com) fronts everything with a Worker
# that routes /api/* and /sitemap.xml to voteapp-api and everything else to
# voteapp-ssr (infra/cloudflare/router-worker.js). Cookies stay same-origin.
# Client IP: the Worker copies Cloudflare's CF-Connecting-IP into the custom
# X-Voteapp-Client-IP header (stripping client-supplied copies), which both
# servers trust via ADDRESS_API_TRUSTED_CLIENT_IP_HEADER. The reserved
# CF-Connecting-IP name itself is unusable past the Worker: the
# *.onrender.com origins sit behind Render's own Cloudflare, which 403s
# outside clients presenting that header — the SSR loader's relay to the
# API's public host would break (and the value would be overwritten anyway).
#
# Secrets (sync: false) are entered in the Render dashboard: AWS SES
# send-only key pair, the optional EDGE_SHARED_SECRET, and
# GOOGLE_PLACES_API_KEY (optional to boot, but address autocomplete 500s
# without it). NOTE: a
# Blueprint sync only prompts for sync: false vars present at blueprint
# creation — ones added later must be entered manually on the service
# (docs/deploy-render.md "Direct onrender.com access" has the sequence).
#
# PLANS: everything except Redis is paid. The Postgres instance (upgraded
# 2026-08-08 off the expiring free plan), the voteapp-embeddings private
# service (starter, ~$7/mo; added 2026-08-12 for the chatbot), and — since
# 2026-08-21 — both web services (starter, ~$7/mo each). The web upgrade was
# bought for LATENCY: free instances spun down after ~15 idle minutes and
# cold-started (~1 minute) on the next request, and a page load woke both of
# them in series. The worker + cron sections below are still commented out;
# they are a separate spend decision.

services:
  # ---------------------------------------------------------------- API ----
  - name: voteapp-api
    type: web
    runtime: node
    region: ohio
    # Starter since 2026-08-21 (see the PLANS note at the top): paid instances
    # never spin down, so the loaders no longer pay a cold-start penalty.
    plan: starter
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run address:api
    # Readiness probe: SELECT 1 on the API pool under a 3 s deadline, exempt
    # from rate limiting. The old target (/api/research-areas) was a public,
    # rate-limited catalog read whose 429s could mark a healthy instance
    # dead.
    healthCheckPath: /api/healthz
    envVars:
      # DATABASE_URL is the OWNER connection string (Blueprint-managed, used
      # by migrations/workers). To run the API as the least-privilege
      # voteapp_api role instead, add API_DATABASE_URL directly in the Render
      # dashboard (docs/postgres-api-role.md) — deliberately NOT declared
      # here: dashboard-only vars survive Blueprint syncs untouched, while a
      # declared-but-unsynced var would re-prompt on every sync.
      - key: DATABASE_URL
        fromDatabase:
          name: voteapp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: voteapp-redis
          type: keyvalue
          property: connectionString
      - key: ADDRESS_API_HOST
        value: 0.0.0.0
      - key: ADDRESS_API_PORT
        value: "10000"
      - key: ADDRESS_API_TRUSTED_CLIENT_IP_HEADER
        value: X-Voteapp-Client-IP
      # Shared with the Cloudflare Worker (secret var of the same name) and
      # the SSR service below: the API only trusts X-Voteapp-Client-IP on
      # requests carrying the matching X-Edge-Secret header, so a direct
      # *.onrender.com hit can no longer spoof per-IP rate limiting. Must be
      # >= 32 chars, and REQUIRED here: with DEPLOY_ENV=production and the
      # trusted header set, the server refuses to boot without it (nothing
      # shields the custom header from direct *.onrender.com spoofing).
      - key: EDGE_SHARED_SECRET
        sync: false
      # IndexNow ownership key, served at /indexnow-key.txt (via the Worker →
      # /api/indexnow-key.txt) and used by
      # `npm run indexnow:submit` (docs/answer-engines.md). Optional: unset
      # answers 404 there. Not a secret in the security sense (the file is
      # public by design), but set in the dashboard so it never lands in git.
      - key: INDEXNOW_KEY
        sync: false
      - key: AUTH_PUBLIC_BASE_URL
        value: https://electionssimplified.com
      - key: SITE_ORIGIN
        value: https://electionssimplified.com
      # Browsers send an Origin header on every non-GET request even
      # same-origin, so the site's own origin must be allowlisted or all
      # browser POST/PUT/DELETE calls 403. The server also derives this from
      # SITE_ORIGIN; the explicit value guards against config drift.
      # www is included even though the edge Worker 301s it to the apex:
      # a POST that somehow originates from a www page must not 403.
      - key: ADDRESS_API_ALLOWED_ORIGINS
        value: https://electionssimplified.com,https://www.electionssimplified.com
      - key: AUTH_SESSION_COOKIE_SECURE
        value: "true"
      - key: AUTH_FROM_EMAIL
        value: noreply@electionssimplified.com
      - key: AUTH_REPLY_TO_EMAIL
        value: contact@electionssimplified.com
      - key: AUTH_SES_REGION
        value: us-east-2
      - key: NOTIFICATIONS_UNSUBSCRIBE_URL
        value: https://electionssimplified.com/api/email/unsubscribe
      # Physical postal address printed in the footer of issue broadcasts and
      # member newsletters (CAN-SPAM 16 CFR 316.5). Public, not a secret.
      - key: EMAIL_POSTAL_ADDRESS
        value: "Elections Simplified Inc., 1401 21st St #12323, Sacramento, CA 95811, US"
      - key: DEPLOY_ENV
        value: production
      # Google Places key for /api/address/autocomplete (+retrieve). Without
      # it the endpoint 500s ("Address autocomplete is not configured") and
      # the frontend silently disables the address dropdown for the session.
      # sync: false vars added after blueprint creation are NOT prompted for
      # by a sync — enter the value manually on the voteapp-api service.
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      # --- Support payments (docs/plans/membership-contributions.md) ----
      # Money feature, off until the secret key is entered manually (sync:
      # false, same caveat as GOOGLE_PLACES_API_KEY: enter on the service).
      # Setting STRIPE_SECRET_KEY makes the other two REQUIRED at boot.
      # Prerequisite: the Terms 1.2 / Privacy 1.3 legal bundle must already
      # be live. Use a restricted key; pin the webhook endpoint's API version
      # to the SDK's pinned version when creating it.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_MEMBERSHIP_PRODUCT_ID
        sync: false
      # --- Usage analytics (docs/plans/usage-analytics.md) ----------------
      # First-party intake for POST /api/usage/events. A write feature, so
      # it is explicit here rather than defaulted on; the privacy policy
      # 1.5 text (docs/legal/privacy-policy.md) ships in the same SSR
      # build, and voteapp-ssr's VITE_USAGE_ANALYTICS_ENABLED mirrors it.
      - key: USAGE_ANALYTICS_ENABLED
        value: "true"
      # --- Chatbot "Ask" (free read side; docs/plans/chatbot-rag.md) ----
      # Retrieval-only until the dashboard-only LLM vars are set (see the
      # voteapp-embeddings comment). Host and port are split on purpose:
      # the HOST is Render's generated private hostname (fromService
      # property: host — hardcoding it would break on service recreation),
      # while the PORT is ours — the same file pins 8080 in dockerCommand.
      # The hostport property is deliberately NOT used: observed 2026-08-12
      # resolving a stale reserved :10000 while the app listened on 8080.
      # readChatbotEmbeddingsFromEnv composes http://<host>:<port>.
      - key: CHATBOT_ENABLED
        value: "true"
      - key: CHATBOT_EMBEDDINGS_HOST
        fromService:
          name: voteapp-embeddings
          type: pserv
          property: host
      - key: CHATBOT_EMBEDDINGS_PORT
        value: "8080"
      # Signs the 👍/👎 feedback tokens (chatbot/feedback.ts). Must be
      # STABLE across restarts: the free plan spins the process down when
      # idle, and a per-boot secret would invalidate every token minted
      # before the wake-up. Unset → per-boot fallback (votes dropped after
      # each restart, warned at boot).
      - key: CHATBOT_FEEDBACK_SECRET
        generateValue: true
      # --- Finance read flags -------------------------------------------
      # Display-only switches: they gate whether stored finance data is
      # returned to the cards, and cost nothing. Without them production
      # holds the data but renders no money at all, which looks like a
      # failed data load. Declared here so a deploy turns them on rather
      # than someone remembering 35 dashboard edits.
      #
      # The matching *_SYNC_ENABLED / *_RAW_DATA_REFRESH_ENABLED flags are
      # deliberately NOT here: those fetch from state disclosure sites and
      # can get us rate-limited or blocked, so they stay opt-in per run.
      - key: ALABAMA_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: ALASKA_CAMPAIGN_FINANCE_ENABLED
        value: "true"
      - key: ARIZONA_CAMPAIGN_FINANCE_ENABLED
        value: "true"
