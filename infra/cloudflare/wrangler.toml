# CLI deploys for the edge router (docs/deploy-render.md "Cloudflare
# Worker"). The Worker was originally created by pasting router-worker.js
# into the dashboard; this config lets `npm ci && npm run deploy` (Node
# 22+; wrangler is pinned in package.json so deploys don't silently adopt
# a newer CLI) update it instead.
#
# keep_vars is REQUIRED: API_ORIGIN / SSR_ORIGIN are plain vars set in the
# dashboard, and without keep_vars a wrangler deploy deletes any var not
# declared in this file. (EDGE_SHARED_SECRET is a secret; secrets always
# survive deploys.) Routes ARE declared here (see `routes` below) and are
# managed by deploys as of the electionssimplified.com cutover.
name = "voteapp-router"
main = "router-worker.js"
compatibility_date = "2026-07-01"
keep_vars = true

# No workers.dev copy: the site is only ever served through the zone routes,
# and a *.workers.dev twin would be an unmonitored second front door.
workers_dev = false

# Zone routes are managed here (IaC) as of the electionssimplified.com
# cutover; the old impactperdollar.com routes were dashboard-managed and
# removed at cutover. Both hostnames' DNS records must be proxied
# (orange-cloud) for these to receive traffic.
routes = [
  { pattern = "electionssimplified.com/*", zone_name = "electionssimplified.com" },
  { pattern = "www.electionssimplified.com/*", zone_name = "electionssimplified.com" },
]

# Workers Logs: keeps the Worker's console.log lines (the `event:crawler`
# line per search/AI bot hit — see classifyCrawler in router-worker.js) for
# the free tier's retention window, viewable under the Worker's Logs tab.
# Sampled at 100% because crawler traffic is a small fraction of requests.
# Invocation logs stay OFF: they would record every request's full URL
# (share-link tokens, email-verification tokens in query strings); the
# sanitized crawler line is the only thing meant to persist.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1
