name: Backend

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Migration file check
        run: npm run db:migrate:check-files

      - name: Unit tests
        run: npm run test

      - name: Auth proxy E2E
        run: npm run test:e2e:proxy

  migrate:
    name: Apply migrations from empty database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # pgvector-enabled build of the official postgres image: migration 234
        # runs CREATE EXTENSION vector, which plain postgres:16 does not ship.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: voteapp
          POSTGRES_PASSWORD: voteapp
          POSTGRES_DB: voteapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voteapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply all migrations against empty database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://voteapp:voteapp@localhost:5432/voteapp

      # The parity test needs a live Postgres, which only this job provides;
      # the unit-test job skips it because DATABASE_URL is unset there.
      - name: Finance label normalization parity
        run: npx vitest run tests/pipeline/finance/normalizeFinanceLabelParity.test.ts
        env:
          DATABASE_URL: postgresql://voteapp:voteapp@localhost:5432/voteapp

      # Missing-generals contest-key pairing is regex SQL; only Postgres shows
      # which title pairs it actually matches.
      - name: Missing-generals contest-key pairing
        run: npx vitest run tests/scripts/listMissingGeneralElectionsContestKey.db.test.ts
        env:
          DATABASE_URL: postgresql://voteapp:voteapp@localhost:5432/voteapp

      # The append-only guard on user_terms_acceptances has to reject direct
      # writes while still allowing the cascade from account deletion. That
      # distinction is Postgres behaviour, not something the SQL text shows.
      - name: Terms acceptance append-only guard
        run: npx vitest run tests/pipeline/users/userTermsAcceptancesTrigger.test.ts
        env:
          DATABASE_URL: postgresql://voteapp:voteapp@localhost:5432/voteapp

      # Pool deadlines: whether Postgres cancels at statement_timeout and the
      # client comes back reusable is server behaviour, not config text.
      - name: API DB pool deadlines
        run: npx vitest run tests/api/apiDbPool.db.test.ts
        env:
          DATABASE_URL: postgresql://voteapp:voteapp@localhost:5432/voteapp

      # A real PoolClient has both connect and release; only a live connection
      # shows whether a writer given one commits the caller's transaction.
      - name: Finance snapshot writer pool boundary
        run: npx vitest run tests/pipeline/newMexicoFinance/newMexicoFinanceWriterPoolBoundary.db.test.ts
        env:
          DATABASE_URL: postgresql://voteapp:voteapp@localhost:5432/voteapp

      # Auth links issued under a previous owner or credential must stop
      # working when the ownership change commits, and consumers must lock the
      # user row before consuming. Whether the void hits the rows a later
      # consume would accept is row-level behaviour, so it needs a real DB.
      - name: Auth-token lifecycle
        run: npx vitest run tests/auth/authTokenLifecycle.db.test.ts
        env:
          DATABASE_URL: postgresql://voteapp:voteapp@localhost:5432/voteapp

      # Same-identity manual-link protection is an ON CONFLICT CASE plus a
      # pre-INSERT retire step per writer; what those leave in the row is
      # Postgres behaviour, so every writer is exercised against a real table.
      - name: Finance manual-link protection across writers
        run: npx vitest run tests/pipeline/finance/manualLinkProtection.db.test.ts
        env:
          DATABASE_URL: postgresql://voteapp:voteapp@localhost:5432/voteapp

      - name: Manual district queue claim integration
        run: npx vitest run tests/pipeline/address/manualDistrictResearchRequests.test.ts
        env:
          MANUAL_DISTRICT_QUEUE_INTEGRATION: "true"
          MANUAL_DISTRICT_QUEUE_INTEGRATION_DATABASE_URL: postgresql://voteapp:voteapp@localhost:5432/voteapp
